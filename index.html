<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>M1 실시간</title>
<style>
:root{--bg:#0b1220;--card:#131c2e;--line:#22304a;--ink:#e2e8f0;--mute:#94a3b8;--acc:#22c55e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo",sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
button{font:inherit;color:var(--ink);background:#1e293b;border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:4px}
button:active{background:#334155}
input{font:inherit;color:var(--ink);background:#0f172a;border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:110px;-webkit-user-select:text;user-select:text}
label{display:inline-block;margin:6px 14px 6px 0;color:var(--mute)}
h1{font-size:22px;margin:0 0 6px}
.mute{color:var(--mute)}
.scr{position:absolute;top:0;left:0;right:0;bottom:0;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 12px)}
#scr-home{overflow-y:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.big{font-size:18px;padding:16px 22px}
textarea{width:100%;height:160px;background:#0f172a;color:var(--ink);border:1px solid var(--line);border-radius:10px;font:12px ui-monospace,Menlo,monospace;-webkit-user-select:text;user-select:text}
/* 영상 무대: 화면에 따라 크기·위치만 바뀜 */
#stage{position:fixed;background:#000;overflow:hidden;z-index:1}
#stage video{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:contain}
#stage canvas{position:absolute;top:0;left:0;touch-action:none}
body[data-screen=home] #stage{display:none}
body[data-screen=align] #stage{top:calc(env(safe-area-inset-top) + 64px);left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 150px)}
body[data-screen=main] #stage{top:calc(env(safe-area-inset-top) + 10px);right:12px;width:200px;height:150px;border-radius:12px;border:1px solid var(--line)}
#align-top{position:absolute;top:calc(env(safe-area-inset-top) + 10px);left:16px;right:16px}
#align-status{font-weight:600;color:#fbbf24}#align-status.ok{color:var(--acc)}
#align-bot{position:absolute;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 10px)}
#learn{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:6px}
/* 기록 화면 */
#main-top{position:absolute;top:calc(env(safe-area-inset-top) + 10px);left:16px;right:228px}
#status{font-size:20px;font-weight:700}#status.run{color:#f43f5e}#status.wait{color:#fbbf24}#status.done{color:var(--acc)}
.dot{display:inline-block;width:10px;height:10px;border-radius:5px;margin:0 4px 0 10px;background:#ef4444}.dot.g{background:var(--acc)}
#nums{display:flex;flex-wrap:wrap;margin-top:8px}
.num{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 14px;margin:0 10px 10px 0;min-width:120px}
.num .k{font-size:12px;color:var(--mute)}.num .v{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums}
#chart-wrap{position:absolute;left:16px;right:16px;top:calc(env(safe-area-inset-top) + 170px);bottom:calc(env(safe-area-inset-bottom) + 190px)}
#chart{width:100%;height:100%}
#pred{position:absolute;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 120px);font-size:15px}
#pred div{margin:3px 0}#pred b{font-size:18px}
.tag{display:inline-block;width:64px;font-weight:700}
#ctrl{position:absolute;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 8px)}
.pw{min-width:58px;font-size:18px;font-weight:700}.pw.on{background:#166534;border-color:var(--acc)}
.spd.on{background:#1e3a8a}
#btn-fc{background:#881337;border-color:#f43f5e}#btn-drop{background:#334155}
#done-bar{position:absolute;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 70px);background:var(--card);border:1px solid var(--acc);border-radius:14px;padding:8px;z-index:3}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 70px);transform:translateX(-50%);background:#0f766e;color:#fff;padding:12px 20px;border-radius:14px;font-size:18px;font-weight:700;z-index:9;box-shadow:0 6px 24px rgba(0,0,0,.4)}
</style></head>
<body data-screen="home">
<div id="stage"><video id="video" playsinline muted autoplay></video><canvas id="overlay"></canvas></div>

<div id="scr-home" class="scr">
  <h1>M1 실시간</h1>
  <div class="mute">패널을 카메라로 읽어 BT·AT·RoR을 실시간으로 기록합니다. 화면을 계속 켜 두려면 자동 잠금을 꺼 주세요.</div>
  <div class="card">
    <button id="btn-cam" class="big">카메라로 시작</button>
    <label style="display:inline-block"><span class="mute">연습:</span> <input id="file" type="file" accept="video/*" style="width:220px"></label>
  </div>
  <div class="card">
    <b>설정</b><br>
    <label>1차 팝 예상 온도 <input id="set-fcTemp" type="number" style="width:80px">℃</label>
    <label>투입 때 화력 <input id="set-startPower" type="number" step="10" style="width:70px"></label>
    <label>투입량 <input id="set-size" type="number" style="width:80px">g</label><br>
    <label>배치 이름 <input id="set-name" style="width:200px"></label>
    <label>생두 <input id="set-green" style="width:240px"></label><br>
    <label><input id="set-alerts" type="checkbox" style="width:auto"> 140·150·159·173℃ 알림</label>
  </div>
  <button id="btn-last" style="display:none">지난 기록 CSV 보기</button>
  <textarea id="csv-box-home" style="display:none" readonly></textarea>
</div>

<div id="scr-align" class="scr" style="display:none">
  <div id="align-top"><div id="align-status"></div><div class="mute" style="font-size:13px">칸 안을 끌어 옮기고, 오른쪽 아래 네모를 끌어 크기를 바꿉니다. 칸은 숫자를 감싼 <b>검은 바탕 안쪽</b>에 두세요.</div></div>
  <div id="align-bot">
    <div id="learn" style="display:none">
      지금 패널에 보이는 숫자를 입력하면 그 모양을 익힙니다 (일부만 입력해도 됨)<br>
      <label>BT <input id="lrn-bt" inputmode="numeric" style="width:70px"></label>
      <label>AT <input id="lrn-at" inputmode="numeric" style="width:70px"></label>
      <label>타이머 6자리 <input id="lrn-timer" inputmode="numeric" placeholder="000000" style="width:100px"></label>
      <button id="btn-learn-go">익히기</button>
    </div>
    <label style="margin-left:6px"><input id="ghost-on" type="checkbox" checked style="width:auto"> 지난 구도 겹쳐 보기</label>
    <button id="btn-default">기본 위치</button>
    <button id="btn-learn">숫자 익히기</button>
    <button id="btn-diag">진단 사진</button>
    <button id="btn-ready" class="big" style="background:#166534;border-color:#22c55e">완료 → 대기</button>
  </div>
</div>

<div id="scr-main" class="scr" style="display:none">
  <div id="main-top">
    <span id="status"></span>
    <span style="float:right;font-size:13px" class="mute">판독<span id="h-bt" class="dot"></span>BT<span id="h-at" class="dot"></span>AT<span id="h-ror" class="dot"></span>ROR<span id="h-timer" class="dot"></span>타이머 · <span id="fps"></span></span>
    <div id="nums">
      <div class="num"><div class="k">BT ℃</div><div class="v" id="v-bt" style="color:#ff5d8f">—</div></div>
      <div class="num"><div class="k">AT ℃</div><div class="v" id="v-at" style="color:#38bdf8">—</div></div>
      <div class="num"><div class="k">실제 RoR ℃/분</div><div class="v" id="v-ror" style="color:#22c55e">—</div></div>
      <div class="num"><div class="k">화면 ROR / 60초 합</div><div class="v" id="v-disp" style="color:#facc15;font-size:28px">—</div></div>
      <div class="num"><div class="k">목표 1차 팝 (150℃+3:10)</div><div class="v" id="p-target" style="font-size:28px">—</div></div>
    </div>
  </div>
  <div id="chart-wrap"><canvas id="chart"></canvas></div>
  <div id="pred">
    <div><span class="tag" style="color:#22c55e">유지</span><span id="p-hold"></span></div>
    <div><span class="tag" style="color:#f59e0b">−10</span><span id="p-cut"></span></div>
  </div>
  <div id="done-bar" style="display:none">
    <b style="margin:0 8px">기록이 끝났습니다</b>
    <button id="btn-csv">CSV 저장</button><button id="btn-copy">CSV 복사</button><button id="btn-new">새 로스팅</button>
    <textarea id="csv-box" style="display:none" readonly></textarea>
  </div>
  <div id="ctrl">
    <span>화력</span>
    <button class="pw" data-p="80">80</button><button class="pw" data-p="70">70</button><button class="pw" data-p="60">60</button><button class="pw" data-p="50">50</button><button class="pw" data-p="40">40</button><button class="pw" data-p="30">30</button><button class="pw" data-p="20">20</button>
    <button id="btn-fc" class="big">1차 팝</button><button id="btn-drop" class="big">배출</button>
    <button id="btn-stop">종료</button><button id="btn-start-now">지금 투입</button><button id="btn-realign">칸 맞추기</button><button id="btn-diag2">진단</button>
    <span id="spd-row" style="display:none"><button class="spd on" data-s="1">1×</button><button class="spd" data-s="2">2×</button><button class="spd" data-s="4">4×</button></span>
  </div>
</div>
<div id="toast" style="display:none"></div>
<script>/* M1 패널 판독 핵심 — 브라우저(사파리 14)와 Node 공용. 외부 라이브러리 없음.
   입력: {data:RGBA 또는 RGB 배열, width, height, ch:4|3}, 칸 좌표, 숫자 틀
   방식: 칸 안(검은 바탕)에서 밝기로 숫자를 떼어 16x24로 정규화 → 틀과 제곱오차 비교 */
var M1 = (function () {
  var NW = 16, NH = 24;

  function cropV(img, box) {
    var x0 = Math.max(0, box[0] | 0), y0 = Math.max(0, box[1] | 0);
    var x1 = Math.min(img.width, box[2] | 0), y1 = Math.min(img.height, box[3] | 0);
    var w = x1 - x0, h = y1 - y0, v = new Uint8Array(w * h), ch = img.ch || 4, d = img.data;
    for (var y = 0; y < h; y++) for (var x = 0; x < w; x++) {
      var i = ((y0 + y) * img.width + (x0 + x)) * ch;
      var r = d[i], g = d[i + 1], b = d[i + 2];
      v[y * w + x] = r > g ? (r > b ? r : b) : (g > b ? g : b);
    }
    return { v: v, w: w, h: h };
  }

  function otsu(v) {
    var hist = new Array(256).fill(0), n = v.length, i;
    for (i = 0; i < n; i++) hist[v[i]]++;
    var sum = 0; for (i = 0; i < 256; i++) sum += i * hist[i];
    var sB = 0, wB = 0, best = 0, th = 128;
    for (i = 0; i < 256; i++) {
      wB += hist[i]; if (!wB) continue; var wF = n - wB; if (!wF) break;
      sB += i * hist[i]; var mB = sB / wB, mF = (sum - sB) / wF, bt = wB * wF * (mB - mF) * (mB - mF);
      if (bt > best) { best = bt; th = i; }
    }
    return th;
  }

  function morph(m, w, h, r, dil) {           // 정사각 커널 팽창(dil=true) / 침식
    var o = new Uint8Array(w * h);
    for (var y = 0; y < h; y++) for (var x = 0; x < w; x++) {
      var hit = dil ? 0 : 1;
      for (var dy = -r; dy <= r && (dil ? !hit : hit); dy++) for (var dx = -r; dx <= r; dx++) {
        var yy = y + dy, xx = x + dx, val = (yy < 0 || yy >= h || xx < 0 || xx >= w) ? 0 : m[yy * w + xx];
        if (dil && val) { hit = 1; break; }
        if (!dil && !val) { hit = 0; break; }
      }
      o[y * w + x] = hit;
    }
    return o;
  }

  function components(m, w, h) {
    var lab = new Int32Array(w * h), out = [], stack = [], id = 0;
    for (var s = 0; s < w * h; s++) {
      if (!m[s] || lab[s]) continue;
      id++; var x0 = w, y0 = h, x1 = -1, y1 = -1, area = 0; stack.push(s); lab[s] = id;
      while (stack.length) {
        var p = stack.pop(), px = p % w, py = (p / w) | 0; area++;
        if (px < x0) x0 = px; if (px > x1) x1 = px; if (py < y0) y0 = py; if (py > y1) y1 = py;
        for (var dy = -1; dy <= 1; dy++) for (var dx = -1; dx <= 1; dx++) {
          var nx = px + dx, ny = py + dy; if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
          var q = ny * w + nx; if (m[q] && !lab[q]) { lab[q] = id; stack.push(q); }
        }
      }
      out.push([x0, y0, x1 - x0 + 1, y1 - y0 + 1, area]);
    }
    return out;
  }

  function resizeArea(m, w, sx, sy, gw, gh) { // m의 (sx,sy,gw,gh) 영역 → NWxNH 평균
    var o = new Float32Array(NW * NH);
    for (var oy = 0; oy < NH; oy++) for (var ox = 0; ox < NW; ox++) {
      var fx0 = ox * gw / NW, fx1 = (ox + 1) * gw / NW, fy0 = oy * gh / NH, fy1 = (oy + 1) * gh / NH;
      var acc = 0, wt = 0;
      for (var y = Math.floor(fy0); y < Math.ceil(fy1); y++) {
        var wy = Math.min(fy1, y + 1) - Math.max(fy0, y); if (wy <= 0) continue;
        for (var x = Math.floor(fx0); x < Math.ceil(fx1); x++) {
          var wx = Math.min(fx1, x + 1) - Math.max(fx0, x); if (wx <= 0) continue;
          acc += wx * wy * m[(sy + y) * w + (sx + x)]; wt += wx * wy;
        }
      }
      o[oy * NW + ox] = wt ? acc / wt : 0;
    }
    return o;
  }

  /* 칸 → [{kind:'d'|'-', g:Float32Array}] */
  function glyphs(img, box, field) {
    var c = cropV(img, box), w = c.w, h = c.h, v = c.v, th = Math.max(70, otsu(v));
    var m = new Uint8Array(w * h);
    for (var i = 0; i < w * h; i++) m[i] = v[i] > th ? 1 : 0;
    var m0 = m;
    if (field === 'timer') m = morph(morph(m, w, h, 1, true), w, h, 1, false);   // 가는 획 잇기(닫힘)
    var comps = components(m, w, h).filter(function (c) { return c[4] >= 6; });
    if (!comps.length) return [];
    if (field === 'timer') { var tg = timerGlyphs(m, w, h, comps, components(m0, w, h).filter(function (c) { return c[4] >= 4; })); if (tg) return tg; }
    var hmax = 0; comps.forEach(function (c) { if (c[3] > hmax) hmax = c[3]; });
    var tall = comps.filter(function (c) { var tb = c[1] === 0 || c[1] + c[3] >= h; return c[3] >= 0.55 * hmax && !(tb && c[3] < 0.85 * hmax); }).sort(function (a, b) { return a[0] - b[0]; });
    var short = comps.filter(function (c) { return c[3] < 0.55 * hmax; });
    var merged = [];
    tall.forEach(function (c) {
      var L = merged[merged.length - 1];
      if (L && c[0] <= L[0] + L[2] - 2) {
        var nx = Math.min(L[0], c[0]), ny = Math.min(L[1], c[1]);
        merged[merged.length - 1] = [nx, ny, Math.max(L[0] + L[2], c[0] + c[2]) - nx, Math.max(L[1] + L[3], c[1] + c[3]) - ny, L[4] + c[4]];
      } else merged.push(c.slice());
    });
    var items = [];
    merged.forEach(function (c) {
      var x = c[0], y = c[1], gw = c[2], gh = c[3];
      if (field === 'ror' && gw > 0.95 * gh) {            // 숫자에 붙은 마이너스 떼기
        var k = 0;
        while (k < gw) { var s = 0; for (var yy = 0; yy < gh; yy++) s += m[(y + yy) * w + x + k]; if (s >= 0.35 * gh) break; k++; }
        if (k > 0.2 * gh) { items.push({ x: x, kind: '-' }); x += k; gw -= k; }
      }
      var nd = gw > 1.15 * gh ? Math.round(gw / (0.72 * gh)) : 1, cuts = [0];
      if (nd >= 2) {
        var prof = []; for (var xx = 0; xx < gw; xx++) { var s2 = 0; for (var y2 = 0; y2 < gh; y2++) s2 += m[(y + y2) * w + x + xx]; prof.push(s2); }
        for (var j = 1; j < nd; j++) {
          var c0 = Math.floor(j * gw / nd), lo = Math.max(1, c0 - Math.floor(0.18 * gh)), hi = Math.min(gw - 1, c0 + Math.floor(0.18 * gh)), bi = lo;
          for (var q = lo; q < hi; q++) if (prof[q] < prof[bi]) bi = q;
          cuts.push(bi);
        }
      }
      cuts.push(gw);
      for (var t = 0; t + 1 < cuts.length; t++) {
        var a0 = cuts[t], a1 = cuts[t + 1], f = -1, l = -1;
        for (var cx = a0; cx < a1; cx++) { var s3 = 0; for (var y3 = 0; y3 < gh; y3++) s3 += m[(y + y3) * w + x + cx]; if (s3) { if (f < 0) f = cx; l = cx; } }
        if (f < 0) continue;
        items.push({ x: x + f, kind: 'd', g: resizeArea(m, w, x + f, y, l - f + 1, gh) });
      }
    });
    if (field === 'ror') {
      var dx = items.filter(function (z) { return z.kind === 'd'; }).map(function (z) { return z.x; });
      var dg = merged, top = Math.min.apply(null, dg.map(function (c) { return c[1]; })), bot = Math.max.apply(null, dg.map(function (c) { return c[1] + c[3]; }));
      short.forEach(function (c) {
        var cy = c[1] + c[3] / 2, touches = c[0] === 0 || c[1] === 0 || c[0] + c[2] >= w || c[1] + c[3] >= h;
        if (!touches && c[2] > 1.5 * c[3] && c[4] >= 10 && dx.length && c[0] < Math.min.apply(null, dx) && cy > top + 0.3 * (bot - top) && cy < top + 0.7 * (bot - top)) items.push({ x: c[0], kind: '-' });
      });
    }
    items.sort(function (a, b) { return a.x - b.x; });
    if (field !== 'ror') items = items.filter(function (z) { return z.kind === 'd'; });
    else items = items.filter(function (z, i) { return z.kind === 'd' || i === 0; });
    return items;
  }


  /* 타이머 전용: HH:MM:SS 형식. 쌍점(작은 점 두 개)을 찾아 세 덩어리로 나누고 각각 두 자리로 자른다 */
  function timerGlyphs(m, w, h, comps, rawComps) {
    var hmax = 0; comps.forEach(function (c) { if (c[3] > hmax) hmax = c[3]; });
    var dots = rawComps.filter(function (c) { return c[3] < 0.45 * hmax && c[2] < 0.5 * hmax && c[3] >= 2 && c[2] >= 2; });
    var cols = [];                                    // 세로로 쌓인 점 둘 = 쌍점
    dots.forEach(function (d) {
      var cx = d[0] + d[2] / 2, hit = null;
      cols.forEach(function (g) { if (Math.abs(g.cx - cx) < 0.3 * hmax) hit = g; });
      if (hit) { hit.n++; hit.x0 = Math.min(hit.x0, d[0]); hit.x1 = Math.max(hit.x1, d[0] + d[2]); }
      else cols.push({ cx: cx, n: 1, x0: d[0], x1: d[0] + d[2] });
    });
    cols = cols.filter(function (g) { return g.n >= 2; }).sort(function (a, b) { return a.cx - b.cx; });
    if (cols.length !== 2) return null;
    var tall = comps.filter(function (c) { return c[3] >= 0.6 * hmax; });
    if (!tall.length) return null;
    var y0 = Math.min.apply(null, tall.map(function (c) { return c[1]; }));
    var y1 = Math.max.apply(null, tall.map(function (c) { return c[1] + c[3]; }));
    var gh = y1 - y0, ranges = [[0, cols[0].x0], [cols[0].x1, cols[1].x0], [cols[1].x1, w]], out = [];
    function ink(x) { var s = 0; for (var y = y0; y < y1; y++) s += m[y * w + x]; return s; }

  function finish() {

    var meta = { name: settings.name || defName(), green: settings.green, size: settings.size, charge: 170, air: 80, drum: 100, set: 220, notes: 'M1 실시간 앱으로 기록' };
    save('lastCsv', engine.csv(meta)); $('done-bar').style.display = '';
  }
  function csvText() { return engine ? engine.csv({ name: settings.name || defName(), green: settings.green, size: settings.size, charge: 170, air: 80, drum: 100, set: 220, notes: 'M1 실시간 앱으로 기록' }) : load('lastCsv', ''); }
  function downloadCsv() {
    var txt = '\ufeff' + csvText(), name = (settings.name || 'M1_로스팅').replace(/[\\/:*?"<>|\s]+/g, '_') + '.csv';
    try { var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], { type: 'text/csv' })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(function () { document.body.removeChild(a); }, 500); }
    catch (e) { copyCsv(); }
  }
  function copyCsv() {
    var txt = csvText();
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(function () { toast('CSV를 복사했습니다'); }, fallback); else fallback();
    function fallback() { var ta = $('csv-box'); ta.value = txt; ta.style.display = ''; ta.select(); toast('아래 칸을 길게 눌러 복사하세요'); }
  }

  /* ---------- 소리·알림 ---------- */
  var actx = null;
  function unlockAudio() { try { var C = window.AudioContext || window.webkitAudioContext; if (!actx && C) actx = new C(); if (actx && actx.state === 'suspended') actx.resume(); } catch (e) {} }
  function beep(n) { if (!actx) return; for (var i = 0; i < n; i++) { var o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + i * 0.25; o.frequency.value = 1046; g.gain.setValueAtTime(0.25, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.18); o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + 0.2); } }
  var toastT = null;
  function toast(t) { var el = $('toast'); el.textContent = t; el.style.display = ''; clearTimeout(toastT); toastT = setTimeout(function () { el.style.display = 'none'; }, 4000); }

  /* ---------- 버튼 연결 ---------- */
  function bind(id, fn) { $(id).addEventListener('click', function (e) { unlockAudio(); fn(e); }); }
  bind('btn-cam', startCamera);
  $('file').addEventListener('change', function (e) { if (e.target.files[0]) startFile(e.target.files[0]); });
  bind('btn-default', function () { boxes = JSON.parse(JSON.stringify(DEF_BOX)); save('boxes', boxes); drawOverlay(); });
  bind('btn-learn', function () { $('learn').style.display = $('learn').style.display === 'none' ? '' : 'none'; });
  bind('btn-learn-go', learn);
  bind('btn-ready', function () {
    saveGhost(); newEngine(); show('main'); $('done-bar').style.display = 'none'; $('csv-box').style.display = 'none';
    if (source === 'file') { video.playbackRate = speed; video.currentTime = 0; video.play(); }
  });
  bind('btn-realign', function () { if (source === 'file') video.pause(); show('align'); });
  bind('btn-fc', function () { if (engine) { engine.mark('fc'); toast('1차 팝 ' + M1Engine.fmt(engine.now())); } });
  bind('btn-drop', function () { if (engine) { engine.mark('drop'); toast('배출 ' + M1Engine.fmt(engine.now()) + ' — 5초 뒤 기록 종료'); } });
  bind('btn-stop', function () { if (engine && engine.mode === 'run' && confirm('기록을 끝낼까요?')) { engine.stop(); finish(); } });
  bind('btn-start-now', function () { if (engine && engine.mode === 'wait') { engine.charge = nowV() - 4; engine.mode = 'wait'; toast('지금을 투입으로 표시 — 8초 뒤 기록 시작'); } });
  bind('btn-diag', diagnose); bind('btn-diag2', diagnose);
  bind('btn-csv', downloadCsv); bind('btn-copy', copyCsv);
  bind('btn-new', function () { newEngine(); $('done-bar').style.display = 'none'; $('csv-box').style.display = 'none'; if (source === 'file') { video.currentTime = 0; video.play(); } });
  Array.prototype.forEach.call(document.querySelectorAll('.pw'), function (b) { b.addEventListener('click', function () { setPower(+b.getAttribute('data-p')); }); });
  Array.prototype.forEach.call(document.querySelectorAll('.spd'), function (b) { b.addEventListener('click', function () { speed = +b.getAttribute('data-s'); video.playbackRate = speed; Array.prototype.forEach.call(document.querySelectorAll('.spd'), function (x) { x.className = 'spd' + (x === b ? ' on' : ''); }); }); });
  ['fcTemp', 'startPower', 'name', 'green', 'size'].forEach(function (k) { var el = $('set-' + k); el.value = settings[k]; el.addEventListener('change', function () { settings[k] = el.type === 'number' ? +el.value : el.value; save('settings', settings); }); });
  $('set-alerts').checked = !!settings.alerts; $('set-alerts').addEventListener('change', function () { settings.alerts = $('set-alerts').checked; save('settings', settings); });
  if (load('lastCsv', '')) $('btn-last').style.display = '';
  bind('btn-last', function () { var ta = $('csv-box-home'); ta.value = load('lastCsv', ''); ta.style.display = ''; ta.select(); });
  show('home');
})();
</script>
</body></html>
